<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vince Edward B. Lacson</title>
  <meta name="description" content="Let's connect!">
  <meta name="theme-color" content="#eaf1ff">
  <style>
    :root {
      --bg: #ffffff;
      --tint: #eaf1ff;
      --card: #f7f8fa;
      --border: #e8eaee;
      --text: #14171c;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .card {
      width: 100%;
      max-width: 420px;
      animation: rise .5s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* Header */
    .banner {
      height: 130px;
      background: linear-gradient(160deg, var(--tint), #f6f9ff);
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
    }
    .profile { text-align: center; padding: 0 24px; margin-top: -52px; }
    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 5px solid var(--bg);
      box-shadow: 0 6px 18px rgba(37, 99, 235, .25);
    }
    h1 { font-size: 24px; font-weight: 700; margin-top: 16px; letter-spacing: -.2px; }
    .bio { color: var(--muted); margin-top: 6px; font-size: 16px; }

    /* Buttons */
    .links { padding: 28px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      text-align: left;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .btn:hover { border-color: #cfd6e4; box-shadow: 0 4px 14px rgba(20, 23, 28, .06); }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible { outline: 3px solid rgba(37, 99, 235, .45); outline-offset: 2px; }

    .icon {
      flex: 0 0 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--tint);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg, .chev { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .label { flex: 1; min-width: 0; }
    .label small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chev { flex: 0 0 18px; width: 18px; height: 18px; color: #b3b9c5; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      justify-content: center;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, .28);
    }
    .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .btn.primary svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <main class="card">
    <div class="banner"></div>

    <section class="profile">
      <div class="avatar" aria-hidden="true">VL</div>
      <h1>Vince Edward B. Lacson</h1>
      <p class="bio">Let's connect!</p>
    </section>

    <section class="links">
      <button class="btn primary" id="saveContact" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Save Contact
      </button>

      <a class="btn" href="tel:+639957680478">
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <span class="label">Call<small>+63 9957680478</small></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <a class="btn" href="mailto:vincelacson1101@gmail.com">
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
        <span class="label">Email<small>vincelacson1101@gmail.com</small></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <a class="btn" href="https://www.facebook.com/VinceLacson.20" target="_blank" rel="noopener">
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></span>
        <span class="label">Facebook<small>Vince Lacson</small></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <a class="btn" href="https://vincelacson.netlify.app" target="_blank" rel="noopener">
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
        <span class="label">Website<small>vincelacson.netlify.app</small></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </section>
  </main>

  <script>
    // Save Contact: builds a .vcf file from the details above
    document.getElementById("saveContact").addEventListener("click", function () {
      var vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:Lacson;Vince Edward B.;;;",
        "FN:Vince Edward B. Lacson",
        "TEL;TYPE=CELL:+639957680478",
        "EMAIL:vincelacson1101@gmail.com",
        "URL:https://vincelacson.netlify.app",
        "URL:https://www.facebook.com/VinceLacson.20",
        "NOTE:Let's connect!",
        "END:VCARD"
      ].join("\r\n");

      var blob = new Blob([vcard], { type: "text/vcard" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Vince-Lacson.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
